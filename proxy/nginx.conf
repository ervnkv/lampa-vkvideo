worker_processes auto;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    # Coolify ставит перед контейнером свой прокси; реальный IP клиента берём из X-Forwarded-For
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Клиент кэширует токен на сутки, так что 10 запросов в минуту с IP хватает с запасом
    limit_req_zone $binary_remote_addr zone=token:10m rate=10r/m;

    server {
        listen 80;

        location = /token {
            limit_req zone=token burst=5 nodelay;
            limit_req_status 429;

            proxy_ssl_server_name on;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_pass https://api.vk.com/oauth/get_anonym_token?client_id=52461373&scope=video;

            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control no-store always;
        }

        location / {
            return 404;
        }
    }
}
